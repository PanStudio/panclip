[project]
name = "panclip"
version = "1.0.0"
description = "AI-powered clipboard management MCP server for Claude Code"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Anthony Kougkas" }
]
keywords = ["mcp", "clipboard", "ai", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: System Shells",
]

dependencies = [
    "mcp>=2.2,<3",
    "lancedb>=0.41.0",
    "pyarrow>=16.0.0",
    "litellm>=1.76.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
panclip = "panclip.mcp_server:main"

[project.urls]
Homepage = "https://github.com/PanStudio/panclip"
Repository = "https://github.com/PanStudio/panclip.git"
Issues = "https://github.com/PanStudio/panclip/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["panclip"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest-httpx>=0.30.0",
    "pytest-env>=0.8.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["panclip/tests"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by black)