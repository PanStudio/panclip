# PanClip Configuration
server:
  name: "panclip"
  version: "1.0.0"

storage:
  backend: "lancedb"
  path: "~/.panclip/lancedb"
  
cache:
  backend: "redis"  # or "memory"
  ttl: 3600
  
intelligence:
  embedding_model: "${PANCLIP_EMBEDDING_MODEL:-text-embedding-3-small}"
  tagging_model: "${PANCLIP_TAGGING_MODEL:-gpt-3.5-turbo}"
  cache_embeddings: true
  
agent_mode:
  auto_capture: true
  min_content_length: 50
  max_content_length: 10000