name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run --frozen ruff check .

      - name: Format check with black
        run: uv run --frozen black --check .

      - name: Run tests
        run: uv run --frozen pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps
